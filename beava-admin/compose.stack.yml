name: beava-admin

# beava + admin UI. Use this on a server with a Cloudflare tunnel.
#
#   docker compose -f compose.stack.yml up -d --build
# Tunnel ingress → http://127.0.0.1:3000

services:
  beava:
    image: beavadev/beava:edge
    pull_policy: always
    container_name: beava-admin-beava
    restart: unless-stopped
    volumes:
      - ./deploy/beava.yaml:/app/beava.yaml:ro
      - beava-state:/data
    expose:
      - "8080"
      - "8090"
    networks:
      - beava-admin-net

  admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beava-admin-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      BEAVA_ADMIN_UPSTREAM: http://beava:8090
      BEAVA_DATA_UPSTREAM: http://beava:8080
    depends_on:
      - beava
    networks:
      - beava-admin-net

volumes:
  beava-state:

networks:
  beava-admin-net:
    driver: bridge
    name: beava-admin-net
