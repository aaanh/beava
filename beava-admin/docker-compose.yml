name: beava-admin

# Admin UI only — beava running via root README docker run, ports remapped to
# host :8081 (HTTP data) and :8082 (admin sidecar).
#
#   docker compose up -d --build

services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beava-admin-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      BEAVA_ADMIN_UPSTREAM: http://host.docker.internal:8082
      BEAVA_DATA_UPSTREAM: http://host.docker.internal:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
